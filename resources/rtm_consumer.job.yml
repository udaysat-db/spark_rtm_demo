resources:
  jobs:
    rtm_consumer:
      name: "[${bundle.target}] SignalNow — RTM consumer"
      tasks:
        - task_key: consume
          spark_python_task:
            python_file: ../src/rtm_consumer/main.py
            parameters:
              - "--kafka-bootstrap"
              - "${var.kafka_bootstrap_servers}"
              - "--secret-scope"
              - "${var.kafka_secret_scope}"
              - "--input-topic"
              - "${var.input_topic}"
              - "--output-topic"
              - "${var.output_topic}"
              - "--static-path"
              - "/Volumes/${var.catalog}/${var.schema}/static"
              - "--checkpoint"
              - "/Volumes/${var.catalog}/${var.schema}/checkpoints/rtm_consumer"
              - "--source-mode"
              - "rtm"
              - "--metrics-topic"
              - "${var.metrics_topic}"
              - "--rtm-trigger"
              - "${var.rtm_trigger_interval}"
          job_cluster_key: rtm
          libraries:
            - whl: ../dist/*.whl

      job_clusters:
        - job_cluster_key: rtm
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type_id}
            num_workers: ${var.rtm_workers}       # fixed size (no autoscale) — required by RTM
            data_security_mode: SINGLE_USER
            spark_conf:
              spark.databricks.streaming.realTimeMode.enabled: "true"
              spark.sql.execution.sortBeforeRepartition: "false"
              spark.sql.shuffle.partitions: "${var.shuffle_partitions}"
            # Photon OFF, spot OFF. Add cloud availability attrs at deploy time.
