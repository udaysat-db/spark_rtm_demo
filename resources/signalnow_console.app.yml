resources:
  apps:
    signalnow_console:
      name: signalnow-console-${bundle.target}
      description: "SignalNow RTM console — live cold-chain cockpit (tails Kafka alerts + metrics)."
      # The whole app/ directory ships (FastAPI backend, static UI, fleet_roster.csv).
      source_code_path: ../app
      # Env lives in app/app.yaml (Databricks Apps read env from the source app.yaml) and
      # defaults to USE_MOCK_BACKEND=true — so the app deploys fully demoable with NO secrets.
      # To go LIVE (USE_MOCK_BACKEND=false), the app pulls its Kafka connection from the scope
      # via valueFrom: the broker endpoint (kafka_bootstrap) AND the SASL username/password —
      # kept out of this public repo. Uncomment the three secret bindings below and the
      # matching KAFKA_* valueFrom entries in app/app.yaml; the admin deployer applying this
      # grants the app SP READ on the scope. Left commented so the default mock deploy needs
      # no secret scope. See docs/prerequisites.md, "The app".
      resources:
        # - name: kafka-bootstrap            # the key app/app.yaml references via valueFrom
        #   description: "Kafka bootstrap servers for the live console"
        #   secret:
        #     scope: ${var.kafka_secret_scope}
        #     key: kafka_bootstrap
        #     permission: READ
        # - name: kafka-sasl-username
        #   description: "Kafka SASL username for the live console"
        #   secret:
        #     scope: ${var.kafka_secret_scope}
        #     key: sasl_username
        #     permission: READ
        # - name: kafka-sasl-password
        #   description: "Kafka SASL password for the live console"
        #   secret:
        #     scope: ${var.kafka_secret_scope}
        #     key: sasl_password
        #     permission: READ
        # Live control: the console writes the producer's scenario here (append-only).
        # WRITE_VOLUME on the bundle-created control volume, granted to the app SP when
        # the admin deployer applies this (needed in both modes). valueFrom hands the
        # app the deployed (dev-prefixed) volume path. See docs/prerequisites.md, "The app".
        - name: control-volume
          description: "Control volume the console writes to drive the live scenario"
          uc_securable:
            securable_type: VOLUME
            securable_full_name: ${var.catalog}.${resources.schemas.signalnow.name}.control
            permission: WRITE_VOLUME
