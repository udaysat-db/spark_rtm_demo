resources:
  jobs:
    producer:
      name: "[${bundle.target}] SignalNow — RTM producer"
      tasks:
        - task_key: produce
          spark_python_task:
            python_file: ../src/producer/main.py
            parameters:
              - "--kafka-bootstrap"
              - "${var.kafka_bootstrap_servers}"
              - "--secret-scope"
              - "${var.kafka_secret_scope}"
              - "--topic"
              - "${var.input_topic}"
              - "--static-path"
              - "/Volumes/${var.catalog}/${resources.schemas.signalnow.name}/static"
              - "--checkpoint"
              - "/Volumes/${var.catalog}/${resources.schemas.signalnow.name}/checkpoints/producer"
              - "--events-per-second"
              - "${var.events_per_second}"
              - "--scenario"
              - "${var.scenario}"                  # fallback only; the control file wins
              - "--control-path"
              - "/Volumes/${var.catalog}/${resources.schemas.signalnow.name}/control"
              - "--trigger-interval"
              - "1 second"                         # micro-batch; also the live-control latency
          job_cluster_key: rtm
          libraries:
            - whl: ../dist/*.whl

      job_clusters:
        - job_cluster_key: rtm
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type_id}
            num_workers: ${var.rtm_workers}       # fixed size (no autoscale) — required by RTM
            data_security_mode: SINGLE_USER        # Dedicated access mode
            spark_conf:
              # The producer is a plain MICRO-BATCH generator, not RTM (see
              # src/producer/main.py) — RTM off so its control-file broadcast join is
              # allowed. RTM is the consumers' job.
              spark.databricks.streaming.realTimeMode.enabled: "false"
              spark.sql.shuffle.partitions: "${var.shuffle_partitions}"
            # Photon OFF (do not set runtime_engine: PHOTON) and spot OFF — kept for parity.
            aws_attributes:
              availability: ON_DEMAND   # Azure: use azure_attributes.availability: ON_DEMAND
