resources:
  jobs:
    microbatch_consumer:
      name: "[${bundle.target}] SignalNow — micro-batch consumer"
      tasks:
        - task_key: consume
          spark_python_task:
            python_file: ../src/microbatch_consumer/main.py
            parameters:
              - "--kafka-bootstrap"
              - "${var.kafka_bootstrap_servers}"
              - "--secret-scope"
              - "${var.kafka_secret_scope}"
              - "--input-topic"
              - "${var.input_topic}"
              - "--output-topic"
              - "${var.output_topic}"
              - "--static-path"
              - "/Volumes/${var.catalog}/${resources.schemas.signalnow.name}/static"
              - "--checkpoint"
              - "/Volumes/${var.catalog}/${resources.schemas.signalnow.name}/checkpoints/microbatch_consumer"
              - "--source-mode"
              - "microbatch"
              - "--trigger-interval"
              - "${var.processing_time_interval}"
              - "--metrics-topic"
              - "${var.metrics_topic}"
          job_cluster_key: microbatch
          libraries:
            - whl: ../dist/*.whl

      # Plain micro-batch cluster — the deliberate contrast to the RTM one.
      job_clusters:
        - job_cluster_key: microbatch
          new_cluster:
            spark_version: ${var.spark_version}
            instance_pool_id: ${var.instance_pool_id}  # warm pool (standalone; node type + on-demand come from the pool)
            num_workers: ${var.rtm_workers}
            data_security_mode: SINGLE_USER
            spark_conf:
              # No RTM here (the deliberate contrast); still pin the stateful shuffle small.
              spark.sql.shuffle.partitions: "${var.shuffle_partitions}"
            # On-demand (no interruption) comes from the pool.
